# Entorno del portafolio: frontend React y API NestJS con archivos JSON.
initialize: |
  (cd server && [ -f .env ] || cp .env.example .env)
maintenance: |
  npm --prefix client ci
  npm --prefix server ci
  npm run init:data
knowledge:
  - name: run
    contents: |
      npm run dev:server # :3000, necesita server/.env configurado
      npm run dev:client # :5173
  - name: build
    contents: |
      npm --prefix server run build
      npm --prefix client run build
  - name: notes
    contents: |
      Node 24 (.nvmrc).
      Admin en /admin con ADMIN_USER/ADMIN_PASSWORD de server/.env.
      Proyectos y mensajes en server/data/*.json; subidas en server/uploads/.
      Restaurar archivos de un respaldo para trabajar desde un clon nuevo.
