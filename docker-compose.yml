# MySQL 8.4 local para desarrollo.
# Uso: `docker compose up -d` (requiere Docker Desktop en Windows).
# Credenciales SOLO de desarrollo — producción usa variables de entorno.
services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: lestar-translate
    restart: unless-stopped
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      LT_LOAD_ONLY: en,es
      LT_UPDATE_MODELS: 'true'
    volumes:
      - lestar_translate_models:/home/libretranslate/.local:rw

  mysql:
    image: mysql:8.4
    container_name: lestar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: lestar
      MYSQL_PASSWORD: lestar_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - '3306:3306'
    volumes:
      - lestar_mysql:/var/lib/mysql

volumes:
  lestar_translate_models:
  lestar_mysql:
